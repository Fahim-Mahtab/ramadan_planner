<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ramadan Planner ΓÇö Ads Admin</title>

    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --green: #13EC6D;
            --dark: #0f172a;
            --card: #1e293b;
            --border: #334155;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --red: #ef4444;
            --radius: 12px;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--dark);
            color: var(--text);
            min-height: 100vh;
            padding: 24px 16px;
        }

        /* ΓöÇΓöÇ Layout ΓöÇΓöÇ */
        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
        }

        header .logo {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(19, 236, 109, .15);
            display: grid;
            place-items: center;
            font-size: 22px;
        }

        header h1 {
            font-size: 20px;
            font-weight: 700;
        }

        header span {
            font-size: 13px;
            color: var(--muted);
        }

        /* ΓöÇΓöÇ Cards ΓöÇΓöÇ */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 24px;
        }

        .card h2 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        /* ΓöÇΓöÇ Form ΓöÇΓöÇ */
        .form-grid {
            display: grid;
            gap: 14px;
        }

        label {
            font-size: 13px;
            color: var(--muted);
            display: block;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="url"] {
            width: 100%;
            background: var(--dark);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: border-color .2s;
        }

        input:focus {
            border-color: var(--green);
        }

        .row {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .row>* {
            flex: 1;
        }

        /* Toggle switch */
        .toggle-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .switch {
            position: relative;
            width: 44px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            inset: 0;
            background: var(--border);
            border-radius: 24px;
            cursor: pointer;
            transition: .3s;
        }

        .slider::before {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            left: 3px;
            bottom: 3px;
            background: white;
            border-radius: 50%;
            transition: .3s;
        }

        input:checked+.slider {
            background: var(--green);
        }

        input:checked+.slider::before {
            transform: translateX(20px);
        }

        /* Buttons */
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity .2s;
        }

        .btn:hover {
            opacity: .85;
        }

        .btn-primary {
            background: var(--green);
            color: #0f172a;
        }

        .btn-danger {
            background: var(--red);
            color: white;
            padding: 6px 12px;
            font-size: 12px;
        }

        .btn-toggle {
            background: var(--border);
            color: var(--text);
            padding: 6px 12px;
            font-size: 12px;
        }

        .btn:disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        /* Upload area */
        .upload-area {
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: border-color .2s;
            position: relative;
        }

        .upload-area:hover {
            border-color: var(--green);
        }

        .upload-area input {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
        }

        .upload-area p {
            font-size: 13px;
            color: var(--muted);
            margin-top: 6px;
        }

        /* App card preview */
        #appPreview {
            display: none;
            margin-top: 16px;
            border-radius: 16px;
            overflow: hidden;
            background: #1c1c2e;
            box-shadow: 0 8px 32px rgba(0, 0, 0, .5);
        }

        #appPreview img {
            width: 100%;
            max-height: 380px;
            object-fit: contain;
            display: block;
            background: #1c1c2e;
        }

        #appPreview .preview-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
        }

        #appPreview .ad-badge {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            padding: 3px 7px;
            border-radius: 6px;
            color: var(--green);
            border: 1px solid rgba(19, 236, 109, .4);
            background: rgba(19, 236, 109, .12);
            flex-shrink: 0;
        }

        #appPreview .preview-title {
            flex: 1;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #appPreview .preview-arrow {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--green);
            display: grid;
            place-items: center;
            flex-shrink: 0;
            font-size: 14px;
        }

        #previewDimensions {
            font-size: 11px;
            color: var(--muted);
            margin-top: 6px;
            text-align: center;
        }

        /* ΓöÇΓöÇ Ads table ΓöÇΓöÇ */
        .ads-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .ad-item {
            display: flex;
            align-items: center;
            gap: 14px;
            background: var(--dark);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 16px;
        }

        .ad-thumb {
            width: 72px;
            height: 52px;
            border-radius: 6px;
            object-fit: cover;
            background: var(--border);
            flex-shrink: 0;
        }

        .ad-info {
            flex: 1;
            min-width: 0;
        }

        .ad-title {
            font-weight: 600;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .ad-url {
            font-size: 12px;
            color: var(--muted);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 20px;
        }

        .badge-active {
            background: rgba(19, 236, 109, .15);
            color: var(--green);
        }

        .badge-inactive {
            background: rgba(148, 163, 184, .1);
            color: var(--muted);
        }

        .ad-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        /* ΓöÇΓöÇ Toast ΓöÇΓöÇ */
        #toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 13px;
            opacity: 0;
            transition: opacity .3s;
            pointer-events: none;
            z-index: 99;
            white-space: nowrap;
        }

        #toast.show {
            opacity: 1;
        }

        #status {
            font-size: 13px;
            color: var(--muted);
            min-height: 20px;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid var(--border);
            border-top-color: var(--green);
            border-radius: 50%;
            animation: spin .6s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .empty {
            text-align: center;
            color: var(--muted);
            padding: 32px;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="container">

        <!-- Header -->
        <header>
            <div class="logo">≡ƒîÖ</div>
            <div>
                <h1>Ads Admin</h1>
                <span>Ramadan Planner ΓÇö real-time ad manager</span>
            </div>
        </header>

        <!-- Create Ad Form -->
        <div class="card">
            <h2>Γ₧ò Create New Ad</h2>
            <form class="form-grid" id="adForm">

                <div>
                    <label>Ad Title</label>
                    <input type="text" id="title" placeholder="e.g. Ramadan Special Offer" required />
                </div>

                <div class="row">
                    <div>
                        <label>Redirect URL (where user goes on tap)</label>
                        <input type="url" id="redirectUrl" placeholder="https://example.com/offer" required />
                    </div>
                </div>

                <div>
                    <label>Ad Image</label>
                    <div class="upload-area" id="uploadArea">
                        <input type="file" id="imageFile" accept="image/*" />
                        <div id="uploadPrompt">
                            <div style="font-size:28px;">≡ƒû╝</div>
                            <p>Click to upload image (JPG, PNG, WebP)</p>
                        </div>
                    </div>
                    <!-- Live app-like preview -->
                    <div id="appPreview">
                        <img id="previewImg" alt="ad preview" />
                        <div class="preview-bar">
                            <span class="ad-badge">AD</span>
                            <span class="preview-title" id="previewTitle">Ad title will appear here</span>
                            <span class="preview-arrow">ΓåÆ</span>
                        </div>
                    </div>
                    <div id="previewDimensions"></div>
                </div>

                <div class="toggle-row">
                    <label class="switch">
                        <input type="checkbox" id="isActive" checked />
                        <span class="slider"></span>
                    </label>
                    <span style="font-size:14px;">Active (visible in app)</span>
                </div>

                <div style="display:flex;gap:12px;align-items:center;">
                    <button type="submit" class="btn btn-primary" id="submitBtn">Publish Ad</button>
                    <span id="status"></span>
                </div>

            </form>
        </div>

        <!-- Existing Ads -->
        <div class="card">
            <h2>≡ƒôï Existing Ads</h2>
            <div class="ads-list" id="adsList">
                <div class="empty"><span class="spinner"></span> Loading...</div>
            </div>
        </div>

    </div>

    <!-- Toast -->
    <div id="toast"></div>

    <script>
        // ΓöÇΓöÇ CONFIG ΓÇö change these to your actual values ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
        const SUPABASE_URL = 'https://tscpygroiqvulpughnwf.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_gPRbFyQLrya70Jzjili4SQ_2jH7nrfW';
        const STORAGE_BUCKET = 'ad-images';
        // ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ

        const { createClient } = supabase;
        const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ΓöÇΓöÇ Image preview ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
        const imageFileInput = document.getElementById('imageFile');
        const uploadPrompt = document.getElementById('uploadPrompt');
        const appPreview = document.getElementById('appPreview');
        const previewImg = document.getElementById('previewImg');
        const previewDimensions = document.getElementById('previewDimensions');
        const previewTitle = document.getElementById('previewTitle');

        // Keep preview title in sync with the title input
        document.getElementById('title').addEventListener('input', (e) => {
            previewTitle.textContent = e.target.value.trim() || 'Ad title will appear here';
        });

        imageFileInput.addEventListener('change', () => {
            const file = imageFileInput.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                previewImg.onload = function () {
                    const w = this.naturalWidth;
                    const h = this.naturalHeight;
                    previewDimensions.textContent = `Image: ${w} ├ù ${h} px  ΓÇó  ${(file.size / 1024).toFixed(0)} KB`;
                };
                previewImg.src = e.target.result;
                uploadPrompt.style.display = 'none';
                appPreview.style.display = 'block';
            };
            reader.readAsDataURL(file);
        });

        // ΓöÇΓöÇ Form submit ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
        document.getElementById('adForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const title = document.getElementById('title').value.trim();
            const redirectUrl = document.getElementById('redirectUrl').value.trim();
            const isActive = document.getElementById('isActive').checked;
            const imageFile = imageFileInput.files[0];
            const submitBtn = document.getElementById('submitBtn');
            const status = document.getElementById('status');

            if (!imageFile) { toast('Please select an image.', true); return; }

            submitBtn.disabled = true;
            status.innerHTML = '<span class="spinner"></span> Uploading image...';

            try {
                // 1. Upload image to Supabase Storage
                const ext = imageFile.name.split('.').pop();
                const filePath = `ads/${Date.now()}.${ext}`;

                const { error: uploadError } = await db.storage
                    .from(STORAGE_BUCKET)
                    .upload(filePath, imageFile, { contentType: imageFile.type });

                if (uploadError) throw uploadError;

                // 2. Get the public URL
                const { data: { publicUrl } } = db.storage
                    .from(STORAGE_BUCKET)
                    .getPublicUrl(filePath);

                status.innerHTML = '<span class="spinner"></span> Saving ad...';

                // 3. Insert the Ad row
                const { error: insertError } = await db.from('ads').insert({
                    title,
                    image_url: publicUrl,
                    redirect_url: redirectUrl,
                    is_active: isActive,
                });

                if (insertError) throw insertError;

                toast('Γ£à Ad published successfully!');
                e.target.reset();
                appPreview.style.display = 'none';
                uploadPrompt.style.display = 'block';
                previewDimensions.textContent = '';
                previewTitle.textContent = 'Ad title will appear here';
                loadAds();

            } catch (err) {
                console.error(err);
                toast('Γ¥î Error: ' + err.message, true);
            } finally {
                submitBtn.disabled = false;
                status.innerHTML = '';
            }
        });

        // ΓöÇΓöÇ Load ads ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
        async function loadAds() {
            const list = document.getElementById('adsList');
            const { data, error } = await db
                .from('ads')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                list.innerHTML = `<div class="empty">Error loading ads: ${error.message}</div>`;
                return;
            }
            if (!data.length) {
                list.innerHTML = '<div class="empty">No ads yet. Create your first one above!</div>';
                return;
            }

            list.innerHTML = data.map(ad => `
      <div class="ad-item" id="ad-${ad.id}">
        <img class="ad-thumb" src="${ad.image_url}" alt="${ad.title}" onerror="this.src=''" />
        <div class="ad-info">
          <div class="ad-title">${escHtml(ad.title)}</div>
          <div class="ad-url">${escHtml(ad.redirect_url)}</div>
        </div>
        <span class="badge ${ad.is_active ? 'badge-active' : 'badge-inactive'}">
          ${ad.is_active ? 'Active' : 'Inactive'}
        </span>
        <div class="ad-actions">
          <button class="btn btn-toggle" onclick="toggleAd('${ad.id}', ${ad.is_active})">
            ${ad.is_active ? 'Deactivate' : 'Activate'}
          </button>
          <button class="btn btn-danger" onclick="deleteAd('${ad.id}', '${filePath(ad.image_url)}')">
            Delete
          </button>
        </div>
      </div>
    `).join('');
        }

        // ΓöÇΓöÇ Toggle active ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
        async function toggleAd(id, currentActive) {
            const { error } = await db
                .from('ads')
                .update({ is_active: !currentActive })
                .eq('id', id);

            if (error) { toast('Γ¥î ' + error.message, true); return; }
            toast(currentActive ? 'Ad deactivated.' : 'Ad activated!');
            loadAds();
        }

        // ΓöÇΓöÇ Delete ad ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
        async function deleteAd(id, imagePath) {
            if (!confirm('Delete this ad? This cannot be undone.')) return;

            // Remove DB row
            const { error } = await db.from('ads').delete().eq('id', id);
            if (error) { toast('Γ¥î ' + error.message, true); return; }

            // Best-effort: remove image from storage
            if (imagePath) {
                await db.storage.from(STORAGE_BUCKET).remove([imagePath]);
            }

            toast('Ad deleted.');
            loadAds();
        }

        // ΓöÇΓöÇ Realtime subscription ΓÇö list auto-refreshes when another admin acts ΓöÇΓöÇ
        db.channel('admin:ads')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'ads' }, loadAds)
            .subscribe();

        // ΓöÇΓöÇ Helpers ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
        function escHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        // Extract storage path from a full public URL
        function filePath(url) {
            try {
                const u = new URL(url);
                // Path is: /storage/v1/object/public/<bucket>/<path>
                const parts = u.pathname.split(`/object/public/${STORAGE_BUCKET}/`);
                return parts[1] || '';
            } catch { return ''; }
        }

        let toastTimer;
        function toast(msg, isError = false) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.style.borderColor = isError ? 'var(--red)' : 'var(--border)';
            el.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
        }

        // Initial load
        loadAds();
    </script>
</body>
